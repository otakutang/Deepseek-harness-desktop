<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Desktop</title>
<style>
  html, body { height: 100%; margin: 0; background: #0f1115; color: #e6e6e6;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; }
  .box { text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #333;
    border-top-color: #4d9fff; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  p { margin: 0; font-size: 14px; opacity: 0.75; }
</style>
</head>
<body>
  <div class="box"><div class="spin"></div><p>正在启动 DeepSeek Harness…</p></div>
</body>
</html>
